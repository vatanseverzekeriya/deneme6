<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>RPG Mobile - Metin2 Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e27;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
            color: white;
        }

        #gameScreen {
            display: none;
        }

        #gameScreen.active {
            display: block;
        }

        /* Character Selection Screen */
        #charSelect {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #charSelect.hidden {
            display: none;
        }

        .select-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            color: #ffd700;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
        }

        .char-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .char-card:hover, .char-card:active {
            transform: scale(1.05);
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .char-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .char-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .char-desc {
            font-size: 12px;
            color: #aaa;
        }

        /* Game Canvas */
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #1a1a2e;
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
        }

        .stat-bar {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .bar-container {
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .hp-bar { background: linear-gradient(90deg, #ff4444, #cc0000); }
        .mp-bar { background: linear-gradient(90deg, #4444ff, #0000cc); }
        .xp-bar { background: linear-gradient(90deg, #44ff44, #00cc00); }

        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 11px;
            line-height: 20px;
            text-shadow: 1px 1px 2px black;
        }

        /* Skills */
        #skills {
            position: fixed;
            bottom: 100px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .skill-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.5);
            background: rgba(100, 50, 150, 0.8);
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            pointer-events: auto;
            position: relative;
        }

        .skill-btn:active {
            transform: scale(0.9);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .skill-btn.cooldown {
            opacity: 0.5;
            pointer-events: none;
        }

        .skill-icon {
            font-size: 24px;
        }

        .skill-key {
            font-size: 10px;
            margin-top: 2px;
        }

        .cooldown-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Joystick */
        #joystick {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
        }

        .joystick-base {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .joystick-stick {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s;
        }

        /* Inventory */
        #inventory {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            gap: 5px;
            pointer-events: auto;
        }

        .inv-slot {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
        }

        .inv-slot.has-item {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .item-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* Damage Numbers */
        .damage-number {
            position: fixed;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 2px 2px 4px black;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }

        /* Loot notification */
        #lootNotif {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 10px 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from { top: -50px; opacity: 0; }
            to { top: 120px; opacity: 1; }
        }

        @media (max-width: 768px) {
            .char-grid {
                grid-template-columns: 1fr;
            }

            .select-title {
                font-size: 24px;
            }
        }

        .live-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #4ade80;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            z-index: 1000;
        }

        /* Audio Controls */
        #audioControls {
            position: fixed;
            top: 45px;
            right: 10px;
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            min-width: 200px;
            z-index: 999;
            pointer-events: auto;
        }

        #audioControls.hidden {
            display: none;
        }

        .audio-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
        }

        .audio-section {
            margin-bottom: 12px;
        }

        .audio-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 5px;
            color: #ccc;
        }

        .audio-slider {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.2);
            outline: none;
            -webkit-appearance: none;
        }

        .audio-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffd700;
            cursor: pointer;
        }

        .audio-slider::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #ffd700;
            cursor: pointer;
            border: none;
        }

        .audio-btn {
            width: 100%;
            padding: 8px;
            background: rgba(100, 50, 150, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .audio-btn:hover {
            background: rgba(100, 50, 150, 1);
            border-color: #ffd700;
        }

        .audio-btn.muted {
            background: rgba(200, 50, 50, 0.8);
        }

        #audioToggle {
            position: fixed;
            top: 10px;
            right: 100px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(100, 50, 150, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: auto;
            transition: all 0.3s;
        }

        #audioToggle:hover {
            transform: scale(1.1);
            border-color: #ffd700;
        }
    </style>
</head>
<body>
    <div class="live-indicator">🔴 CANLI</div>

    <!-- Audio Toggle Button -->
    <button id="audioToggle">🎵</button>

    <!-- Audio Controls Panel -->
    <div id="audioControls" class="hidden">
        <div class="audio-header">
            <span>🎵 Ses Ayarları</span>
            <span style="cursor: pointer;" onclick="toggleAudioPanel()">✖</span>
        </div>
        <div class="audio-section">
            <div class="audio-label">
                <span>Ana Ses</span>
                <span id="masterValue">30%</span>
            </div>
            <input type="range" class="audio-slider" id="masterVolume" min="0" max="100" value="30">
        </div>
        <div class="audio-section">
            <div class="audio-label">
                <span>Müzik</span>
                <span id="musicValue">40%</span>
            </div>
            <input type="range" class="audio-slider" id="musicVolume" min="0" max="100" value="40">
        </div>
        <div class="audio-section">
            <div class="audio-label">
                <span>Ses Efektleri</span>
                <span id="sfxValue">50%</span>
            </div>
            <input type="range" class="audio-slider" id="sfxVolume" min="0" max="100" value="50">
        </div>
        <button class="audio-btn" id="muteBtn" onclick="toggleMute()">🔊 Sesi Kapat/Aç</button>
    </div>

    <!-- Character Selection -->
    <div id="charSelect">
        <div class="select-title">⚔️ KARAKTER SEÇ ⚔️</div>
        <div class="char-grid">
            <div class="char-card" onclick="selectCharacter('warrior')">
                <div class="char-icon">🛡️</div>
                <div class="char-name">SAVAŞÇI</div>
                <div class="char-desc">Yüksek HP ve savunma</div>
            </div>
            <div class="char-card" onclick="selectCharacter('ninja')">
                <div class="char-icon">🗡️</div>
                <div class="char-name">NİNJA</div>
                <div class="char-desc">Hızlı ve kritik vuruşlar</div>
            </div>
            <div class="char-card" onclick="selectCharacter('shaman')">
                <div class="char-icon">🔮</div>
                <div class="char-name">ŞAMAN</div>
                <div class="char-desc">Büyü ve iyileştirme</div>
            </div>
            <div class="char-card" onclick="selectCharacter('sura')">
                <div class="char-icon">⚡</div>
                <div class="char-name">SURA</div>
                <div class="char-desc">Karanlık sihir uzmanı</div>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div class="stat-bar">
                <div class="player-info">
                    <span id="playerName">Karakter</span>
                    <span id="playerLevel">Seviye: 1</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill hp-bar" id="hpBar" style="width: 100%"></div>
                    <div class="bar-text" id="hpText">HP: 100/100</div>
                </div>
                <div class="bar-container">
                    <div class="bar-fill mp-bar" id="mpBar" style="width: 100%"></div>
                    <div class="bar-text" id="mpText">MP: 100/100</div>
                </div>
                <div class="bar-container">
                    <div class="bar-fill xp-bar" id="xpBar" style="width: 0%"></div>
                    <div class="bar-text" id="xpText">XP: 0/100</div>
                </div>
            </div>
        </div>

        <!-- Skills -->
        <div id="skills"></div>

        <!-- Joystick -->
        <div id="joystick">
            <div class="joystick-base">
                <div class="joystick-stick" id="joystickStick"></div>
            </div>
        </div>

        <!-- Inventory -->
        <div id="inventory">
            <div class="inv-slot" id="slot0"></div>
            <div class="inv-slot" id="slot1"></div>
            <div class="inv-slot" id="slot2"></div>
            <div class="inv-slot" id="slot3"></div>
            <div class="inv-slot" id="slot4"></div>
        </div>

        <!-- Loot Notification -->
        <div id="lootNotif"></div>
    </div>

    <script src="audio-system.js"></script>
    <script src="rpg-game.js"></script>

    <script>
        // Audio controls functionality
        function toggleAudioPanel() {
            const panel = document.getElementById('audioControls');
            panel.classList.toggle('hidden');
        }

        // Toggle audio panel when clicking the audio button
        document.getElementById('audioToggle').addEventListener('click', toggleAudioPanel);

        // Volume sliders
        document.getElementById('masterVolume').addEventListener('input', function(e) {
            const value = e.target.value / 100;
            game.audioManager.setMasterVolume(value);
            document.getElementById('masterValue').textContent = e.target.value + '%';
        });

        document.getElementById('musicVolume').addEventListener('input', function(e) {
            const value = e.target.value / 100;
            game.audioManager.setMusicVolume(value);
            document.getElementById('musicValue').textContent = e.target.value + '%';
        });

        document.getElementById('sfxVolume').addEventListener('input', function(e) {
            const value = e.target.value / 100;
            game.audioManager.setSFXVolume(value);
            document.getElementById('sfxValue').textContent = e.target.value + '%';
        });

        // Mute toggle
        function toggleMute() {
            const enabled = game.audioManager.toggleMute();
            const btn = document.getElementById('muteBtn');
            if (enabled) {
                btn.classList.remove('muted');
                btn.textContent = '🔊 Sesi Kapat';
            } else {
                btn.classList.add('muted');
                btn.textContent = '🔇 Sesi Aç';
            }
        }

        // Live reload
        if (typeof WebSocket !== 'undefined') {
            const ws = new WebSocket('ws://' + window.location.host);
            ws.onmessage = function(event) {
                if (event.data === 'reload') {
                    window.location.reload();
                }
            };
        }
    </script>
</body>
</html>
