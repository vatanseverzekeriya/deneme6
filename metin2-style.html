<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>RPG Mobile - Metin2 Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e27;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
            color: white;
        }

        #gameScreen {
            display: none;
        }

        #gameScreen.active {
            display: block;
        }

        /* Character Selection Screen */
        #charSelect {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #charSelect.hidden {
            display: none;
        }

        .select-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            color: #ffd700;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
        }

        .char-card {
            background: linear-gradient(135deg, rgba(40, 50, 80, 0.7), rgba(30, 40, 70, 0.7));
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3),
                        inset 0 1px 3px rgba(255, 255, 255, 0.1);
        }

        .char-card:hover, .char-card:active {
            transform: scale(1.05) translateY(-5px);
            border-color: #ffd700;
            background: linear-gradient(135deg, rgba(80, 70, 30, 0.8), rgba(60, 50, 20, 0.8));
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4),
                        0 0 30px rgba(255, 215, 0, 0.3),
                        inset 0 1px 3px rgba(255, 215, 0, 0.3);
        }

        .char-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .char-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .char-desc {
            font-size: 12px;
            color: #aaa;
        }

        /* Game Canvas */
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #1a1a2e;
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
        }

        .stat-bar {
            background: linear-gradient(135deg, rgba(10, 10, 20, 0.9), rgba(20, 20, 35, 0.9));
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5),
                        inset 0 1px 2px rgba(255, 255, 255, 0.1);
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .bar-container {
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            position: relative;
            overflow: hidden;
        }

        .hp-bar {
            background: linear-gradient(90deg, #ff4444, #cc0000);
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
        }
        .mp-bar {
            background: linear-gradient(90deg, #4444ff, #0000cc);
            box-shadow: 0 0 10px rgba(68, 68, 255, 0.5);
        }
        .xp-bar {
            background: linear-gradient(90deg, #44ff44, #00cc00);
            box-shadow: 0 0 10px rgba(68, 255, 68, 0.5);
        }

        /* Shine animation for bars */
        .bar-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            50% { left: 100%; }
            100% { left: 100%; }
        }

        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 11px;
            line-height: 20px;
            text-shadow: 1px 1px 2px black;
        }

        /* Skills */
        #skills {
            position: fixed;
            bottom: 100px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .skill-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.5);
            background: linear-gradient(135deg, rgba(120, 70, 180, 0.9), rgba(80, 40, 140, 0.9));
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            pointer-events: auto;
            position: relative;
            box-shadow: 0 4px 15px rgba(100, 50, 150, 0.4),
                        inset 0 -2px 5px rgba(0, 0, 0, 0.3),
                        inset 0 2px 5px rgba(255, 255, 255, 0.2);
        }

        .skill-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(150, 100, 255, 0.6);
            border-color: rgba(255, 255, 255, 0.8);
        }

        .skill-btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.7),
                        inset 0 2px 10px rgba(0, 0, 0, 0.4);
        }

        .skill-btn.cooldown {
            opacity: 0.5;
            pointer-events: none;
        }

        .skill-icon {
            font-size: 24px;
        }

        .skill-key {
            font-size: 10px;
            margin-top: 2px;
        }

        .cooldown-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Joystick */
        #joystick {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
        }

        .joystick-base {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .joystick-stick {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s;
        }

        /* Inventory */
        #inventory {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            gap: 5px;
            pointer-events: auto;
        }

        .inv-slot {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, rgba(40, 40, 60, 0.8), rgba(20, 20, 40, 0.8));
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3),
                        0 2px 8px rgba(0, 0, 0, 0.2);
            transition: all 0.3s;
        }

        .inv-slot.has-item {
            border-color: #ffd700;
            background: linear-gradient(135deg, rgba(80, 70, 30, 0.9), rgba(60, 50, 20, 0.9));
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4),
                        inset 0 2px 5px rgba(255, 215, 0, 0.2);
            animation: itemGlow 2s ease-in-out infinite;
        }

        @keyframes itemGlow {
            0%, 100% {
                box-shadow: 0 0 15px rgba(255, 215, 0, 0.4),
                            inset 0 2px 5px rgba(255, 215, 0, 0.2);
            }
            50% {
                box-shadow: 0 0 25px rgba(255, 215, 0, 0.6),
                            inset 0 2px 5px rgba(255, 215, 0, 0.3);
            }
        }

        .item-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* Damage Numbers */
        .damage-number {
            position: fixed;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 2px 2px 4px black, 0 0 10px currentColor;
            z-index: 1000;
        }

        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-40px) scale(1.2);
            }
            100% {
                opacity: 0;
                transform: translateY(-100px) scale(0.8);
            }
        }

        /* Loot notification */
        #lootNotif {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.95), rgba(30, 30, 30, 0.95));
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 10px 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5),
                        inset 0 1px 3px rgba(255, 255, 255, 0.2);
            font-weight: bold;
            color: #ffd700;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        @keyframes slideDown {
            from {
                top: -50px;
                opacity: 0;
                transform: translateX(-50%) scale(0.8);
            }
            to {
                top: 120px;
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        @media (max-width: 768px) {
            .char-grid {
                grid-template-columns: 1fr;
            }

            .select-title {
                font-size: 24px;
            }
        }

        .live-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #4ade80;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="live-indicator">🔴 CANLI</div>

    <!-- Character Selection -->
    <div id="charSelect">
        <div class="select-title">⚔️ KARAKTER SEÇ ⚔️</div>
        <div class="char-grid">
            <div class="char-card" onclick="selectCharacter('warrior')">
                <div class="char-icon">🛡️</div>
                <div class="char-name">SAVAŞÇI</div>
                <div class="char-desc">Yüksek HP ve savunma</div>
            </div>
            <div class="char-card" onclick="selectCharacter('ninja')">
                <div class="char-icon">🗡️</div>
                <div class="char-name">NİNJA</div>
                <div class="char-desc">Hızlı ve kritik vuruşlar</div>
            </div>
            <div class="char-card" onclick="selectCharacter('shaman')">
                <div class="char-icon">🔮</div>
                <div class="char-name">ŞAMAN</div>
                <div class="char-desc">Büyü ve iyileştirme</div>
            </div>
            <div class="char-card" onclick="selectCharacter('sura')">
                <div class="char-icon">⚡</div>
                <div class="char-name">SURA</div>
                <div class="char-desc">Karanlık sihir uzmanı</div>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div class="stat-bar">
                <div class="player-info">
                    <span id="playerName">Karakter</span>
                    <span id="playerLevel">Seviye: 1</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill hp-bar" id="hpBar" style="width: 100%"></div>
                    <div class="bar-text" id="hpText">HP: 100/100</div>
                </div>
                <div class="bar-container">
                    <div class="bar-fill mp-bar" id="mpBar" style="width: 100%"></div>
                    <div class="bar-text" id="mpText">MP: 100/100</div>
                </div>
                <div class="bar-container">
                    <div class="bar-fill xp-bar" id="xpBar" style="width: 0%"></div>
                    <div class="bar-text" id="xpText">XP: 0/100</div>
                </div>
            </div>
        </div>

        <!-- Skills -->
        <div id="skills"></div>

        <!-- Joystick -->
        <div id="joystick">
            <div class="joystick-base">
                <div class="joystick-stick" id="joystickStick"></div>
            </div>
        </div>

        <!-- Inventory -->
        <div id="inventory">
            <div class="inv-slot" id="slot0"></div>
            <div class="inv-slot" id="slot1"></div>
            <div class="inv-slot" id="slot2"></div>
            <div class="inv-slot" id="slot3"></div>
            <div class="inv-slot" id="slot4"></div>
        </div>

        <!-- Loot Notification -->
        <div id="lootNotif"></div>
    </div>

    <script src="rpg-game.js"></script>

    <script>
        // Live reload
        if (typeof WebSocket !== 'undefined') {
            const ws = new WebSocket('ws://' + window.location.host);
            ws.onmessage = function(event) {
                if (event.data === 'reload') {
                    window.location.reload();
                }
            };
        }
    </script>
</body>
</html>
