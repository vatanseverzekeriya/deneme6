<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <title>RPG Mobile - Metin2 Style</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e27;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
            color: white;
        }

        #gameScreen {
            display: none;
        }

        #gameScreen.active {
            display: block;
        }

        /* Character Selection Screen */
        #charSelect {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #charSelect.hidden {
            display: none;
        }

        .select-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            color: #ffd700;
        }

        .char-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 600px;
        }

        .char-card {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .char-card:hover, .char-card:active {
            transform: scale(1.05);
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .char-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .char-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .char-desc {
            font-size: 12px;
            color: #aaa;
        }

        /* Game Canvas */
        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #1a1a2e;
        }

        /* HUD */
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            right: 10px;
            pointer-events: none;
        }

        .stat-bar {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
        }

        .player-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 14px;
        }

        .bar-container {
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 5px;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            transition: width 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }

        .hp-bar { background: linear-gradient(90deg, #ff4444, #cc0000); }
        .mp-bar { background: linear-gradient(90deg, #4444ff, #0000cc); }
        .xp-bar { background: linear-gradient(90deg, #44ff44, #00cc00); }

        .bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 11px;
            line-height: 20px;
            text-shadow: 1px 1px 2px black;
        }

        /* Skills */
        #skills {
            position: fixed;
            bottom: 100px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .skill-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.5);
            background: rgba(100, 50, 150, 0.8);
            color: white;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            pointer-events: auto;
            position: relative;
        }

        .skill-btn:active {
            transform: scale(0.9);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .skill-btn.cooldown {
            opacity: 0.5;
            pointer-events: none;
        }

        .skill-icon {
            font-size: 24px;
        }

        .skill-key {
            font-size: 10px;
            margin-top: 2px;
        }

        .cooldown-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Joystick */
        #joystick {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 120px;
            height: 120px;
            pointer-events: auto;
        }

        .joystick-base {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }

        .joystick-stick {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.1s;
        }

        /* Inventory */
        #inventory {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            gap: 5px;
            pointer-events: auto;
        }

        .inv-slot {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            position: relative;
        }

        .inv-slot.has-item {
            border-color: #ffd700;
            background: rgba(255, 215, 0, 0.2);
        }

        .item-count {
            position: absolute;
            bottom: 2px;
            right: 4px;
            font-size: 10px;
            background: rgba(0, 0, 0, 0.8);
            padding: 1px 4px;
            border-radius: 3px;
        }

        /* Damage Numbers */
        .damage-number {
            position: fixed;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 2px 2px 4px black;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }

        /* Loot notification */
        #lootNotif {
            position: fixed;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 10px 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s;
        }

        @keyframes slideDown {
            from { top: -50px; opacity: 0; }
            to { top: 120px; opacity: 1; }
        }

        @media (max-width: 768px) {
            .char-grid {
                grid-template-columns: 1fr;
            }

            .select-title {
                font-size: 24px;
            }
        }

        .live-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #4ade80;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: bold;
            z-index: 1000;
        }

        /* Quest Log */
        #questLog {
            position: fixed;
            top: 140px;
            right: 10px;
            width: 280px;
            max-height: 400px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 10px;
            overflow-y: auto;
            pointer-events: auto;
            font-size: 12px;
        }

        .quest-header {
            font-size: 16px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 10px;
            text-align: center;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 5px;
        }

        .quest-section {
            font-size: 13px;
            font-weight: bold;
            color: #60a5fa;
            margin: 10px 0 5px 0;
        }

        .quest-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            padding: 8px;
            margin-bottom: 8px;
        }

        .quest-item.complete {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
        }

        .quest-title {
            font-weight: bold;
            color: #fbbf24;
            margin-bottom: 4px;
        }

        .quest-desc {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 6px;
        }

        .quest-objective {
            font-size: 11px;
            padding: 2px 0;
            color: #ccc;
        }

        .quest-objective.completed {
            color: #4ade80;
            text-decoration: line-through;
        }

        .quest-complete-btn {
            width: 100%;
            padding: 5px;
            margin-top: 5px;
            background: #4ade80;
            border: none;
            border-radius: 5px;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

        .quest-complete-btn:active {
            transform: scale(0.95);
        }

        .no-quests {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        /* Dialogue Box */
        #dialogueBox {
            position: fixed;
            bottom: 200px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #ffd700;
            border-radius: 15px;
            padding: 15px;
            display: none;
            pointer-events: auto;
        }

        .dialogue-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            padding-bottom: 10px;
        }

        .dialogue-npc-icon {
            font-size: 32px;
        }

        .dialogue-npc-name {
            flex: 1;
            font-size: 18px;
            font-weight: bold;
            color: #ffd700;
        }

        .dialogue-close {
            background: rgba(255, 0, 0, 0.7);
            border: none;
            color: white;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
        }

        .dialogue-text {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 15px;
            min-height: 60px;
        }

        .dialogue-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dialogue-option {
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }

        .dialogue-option:hover, .dialogue-option:active {
            background: rgba(255, 215, 0, 0.3);
            border-color: #ffd700;
            transform: translateX(5px);
        }

        /* Story Notification */
        #storyNotif {
            position: fixed;
            top: 140px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #60a5fa;
            border-radius: 10px;
            padding: 12px 20px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: slideDown 0.3s;
            font-size: 14px;
            font-weight: bold;
            z-index: 1001;
        }

        /* Lore Panel */
        #lorePanel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            background: rgba(0, 0, 0, 0.95);
            border: 3px solid #a78bfa;
            border-radius: 15px;
            padding: 20px;
            display: none;
            overflow-y: auto;
            pointer-events: auto;
            z-index: 1002;
        }

        .lore-title {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 15px;
            text-align: center;
        }

        .lore-content {
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
        }

        .lore-section {
            margin-bottom: 15px;
        }

        .lore-section-title {
            font-size: 16px;
            font-weight: bold;
            color: #60a5fa;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            #questLog {
                width: 240px;
                max-height: 300px;
                font-size: 11px;
            }

            #dialogueBox {
                width: 95%;
                bottom: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="live-indicator">🔴 CANLI</div>

    <!-- Character Selection -->
    <div id="charSelect">
        <div class="select-title">⚔️ KARAKTER SEÇ ⚔️</div>
        <div class="char-grid">
            <div class="char-card" onclick="selectCharacter('warrior')">
                <div class="char-icon">🛡️</div>
                <div class="char-name">SAVAŞÇI</div>
                <div class="char-desc">Yüksek HP ve savunma</div>
            </div>
            <div class="char-card" onclick="selectCharacter('ninja')">
                <div class="char-icon">🗡️</div>
                <div class="char-name">NİNJA</div>
                <div class="char-desc">Hızlı ve kritik vuruşlar</div>
            </div>
            <div class="char-card" onclick="selectCharacter('shaman')">
                <div class="char-icon">🔮</div>
                <div class="char-name">ŞAMAN</div>
                <div class="char-desc">Büyü ve iyileştirme</div>
            </div>
            <div class="char-card" onclick="selectCharacter('sura')">
                <div class="char-icon">⚡</div>
                <div class="char-name">SURA</div>
                <div class="char-desc">Karanlık sihir uzmanı</div>
            </div>
        </div>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div class="stat-bar">
                <div class="player-info">
                    <span id="playerName">Karakter</span>
                    <span id="playerLevel">Seviye: 1</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill hp-bar" id="hpBar" style="width: 100%"></div>
                    <div class="bar-text" id="hpText">HP: 100/100</div>
                </div>
                <div class="bar-container">
                    <div class="bar-fill mp-bar" id="mpBar" style="width: 100%"></div>
                    <div class="bar-text" id="mpText">MP: 100/100</div>
                </div>
                <div class="bar-container">
                    <div class="bar-fill xp-bar" id="xpBar" style="width: 0%"></div>
                    <div class="bar-text" id="xpText">XP: 0/100</div>
                </div>
            </div>
        </div>

        <!-- Skills -->
        <div id="skills"></div>

        <!-- Joystick -->
        <div id="joystick">
            <div class="joystick-base">
                <div class="joystick-stick" id="joystickStick"></div>
            </div>
        </div>

        <!-- Inventory -->
        <div id="inventory">
            <div class="inv-slot" id="slot0"></div>
            <div class="inv-slot" id="slot1"></div>
            <div class="inv-slot" id="slot2"></div>
            <div class="inv-slot" id="slot3"></div>
            <div class="inv-slot" id="slot4"></div>
        </div>

        <!-- Loot Notification -->
        <div id="lootNotif"></div>

        <!-- Quest Log -->
        <div id="questLog"></div>

        <!-- Dialogue Box -->
        <div id="dialogueBox"></div>

        <!-- Story Notification -->
        <div id="storyNotif"></div>

        <!-- Lore Panel -->
        <div id="lorePanel"></div>
    </div>

    <script src="story-data.js"></script>
    <script src="narrative-system.js"></script>
    <script src="rpg-game.js"></script>

    <script>
        // Live reload
        if (typeof WebSocket !== 'undefined') {
            const ws = new WebSocket('ws://' + window.location.host);
            ws.onmessage = function(event) {
                if (event.data === 'reload') {
                    window.location.reload();
                }
            };
        }
    </script>
</body>
</html>
