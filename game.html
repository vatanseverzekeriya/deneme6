<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>3D Mobil Oyun</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0a0e27;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            touch-action: none;
            color: white;
        }

        #gameContainer {
            position: fixed;
            inset: 0;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            outline: none;
        }

        #score {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            user-select: none;
            touch-action: manipulation;
            font-weight: bold;
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(255, 255, 255, 0.4);
        }

        #mobileControls {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .arrow-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            font-weight: bold;
        }

        .arrow-btn:active {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(0.9);
        }

        .live-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4ade80;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            animation: pulse 2s infinite;
            z-index: 10;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        #gameOver {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 100;
        }

        #gameOver.active {
            display: flex;
        }

        .game-over-text {
            font-size: 48px;
            font-weight: bold;
            color: #ff4444;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
        }

        .final-score {
            font-size: 32px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="live-indicator">🔴 CANLI</div>

    <div id="gameContainer">
        <canvas id="renderCanvas"></canvas>
        <div id="score">Skor: 0</div>

        <div id="controls">
            <button class="btn" onclick="game.reset()">Yeni Oyun</button>
            <button class="btn" onclick="game.togglePause()">Duraklat</button>
        </div>

        <div id="mobileControls">
            <div class="arrow-btn" ontouchstart="game.moveLeft()" ontouchend="game.stopMove()">◀</div>
            <div class="arrow-btn" ontouchstart="game.moveRight()" ontouchend="game.stopMove()">▶</div>
        </div>

        <div id="gameOver">
            <div class="game-over-text">OYUN BİTTİ!</div>
            <div class="final-score" id="finalScore">Skorunuz: 0</div>
            <button class="btn" onclick="game.reset()">Tekrar Oyna</button>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <script>
        class Game {
            constructor() {
                this.canvas = document.getElementById('renderCanvas');

                // Three.js setup
                this.scene = null;
                this.camera = null;
                this.renderer = null;

                this.player = null;
                this.playerMesh = null;
                this.obstacles = [];
                this.obstacleMeshes = [];

                this.score = 0;
                this.gameOver = false;
                this.paused = false;

                this.keys = {};
                this.moveDirection = 0;

                this.setupScene();
                this.setupControls();
                this.init();
            }

            setupScene() {
                // Scene
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x0a0e27);
                this.scene.fog = new THREE.Fog(0x0a0e27, 30, 80);

                // Camera
                this.camera = new THREE.PerspectiveCamera(
                    60,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                this.camera.position.set(0, 15, 25);
                this.camera.lookAt(0, 0, -10);

                // Renderer
                this.renderer = new THREE.WebGLRenderer({
                    canvas: this.canvas,
                    antialias: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;

                // Lights
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                this.scene.add(ambientLight);

                const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
                directionalLight.position.set(5, 15, 10);
                directionalLight.castShadow = true;
                directionalLight.shadow.camera.left = -30;
                directionalLight.shadow.camera.right = 30;
                directionalLight.shadow.camera.top = 30;
                directionalLight.shadow.camera.bottom = -30;
                this.scene.add(directionalLight);

                // Ground
                const groundGeometry = new THREE.PlaneGeometry(60, 100);
                const groundMaterial = new THREE.MeshStandardMaterial({
                    color: 0x1a3a2e,
                    roughness: 0.8,
                    metalness: 0.2
                });
                const ground = new THREE.Mesh(groundGeometry, groundMaterial);
                ground.rotation.x = -Math.PI / 2;
                ground.position.z = -20;
                ground.receiveShadow = true;
                this.scene.add(ground);

                // Grid lines
                const gridGroup = new THREE.Group();
                for (let i = -5; i < 5; i++) {
                    const lineGeometry = new THREE.PlaneGeometry(0.2, 100);
                    const lineMaterial = new THREE.MeshBasicMaterial({
                        color: 0x444444,
                        transparent: true,
                        opacity: 0.3
                    });
                    const line = new THREE.Mesh(lineGeometry, lineMaterial);
                    line.rotation.x = -Math.PI / 2;
                    line.position.set(i * 4, 0.01, -20);
                    gridGroup.add(line);
                }
                this.scene.add(gridGroup);

                // Player
                this.createPlayer();

                // Resize handler
                window.addEventListener('resize', () => {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                });
            }

            createPlayer() {
                const group = new THREE.Group();

                // Player body
                const bodyGeometry = new THREE.BoxGeometry(2, 2, 2);
                const bodyMaterial = new THREE.MeshStandardMaterial({
                    color: 0x00ff88,
                    emissive: 0x00ff88,
                    emissiveIntensity: 0.3,
                    roughness: 0.5,
                    metalness: 0.5
                });
                const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
                body.castShadow = true;
                body.position.y = 1;
                group.add(body);

                // Glow effect
                const glowGeometry = new THREE.SphereGeometry(1.5, 16, 16);
                const glowMaterial = new THREE.MeshBasicMaterial({
                    color: 0x00ff88,
                    transparent: true,
                    opacity: 0.2
                });
                const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                glow.position.y = 1;
                group.add(glow);

                this.playerMesh = group;
                this.scene.add(this.playerMesh);

                this.player = {
                    x: 0,
                    z: 8,
                    speed: 0.15
                };

                this.playerMesh.position.set(this.player.x, 0, this.player.z);
            }

            setupControls() {
                // Keyboard
                document.addEventListener('keydown', (e) => {
                    this.keys[e.key] = true;
                });

                document.addEventListener('keyup', (e) => {
                    this.keys[e.key] = false;
                });

                // Touch controls
                this.canvas.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const rect = this.canvas.getBoundingClientRect();
                    const x = ((touch.clientX - rect.left) / rect.width) * 2 - 1;
                    this.player.x = x * 12;
                }, { passive: false });
            }

            init() {
                this.spawnObstacle();
                this.gameLoop();
            }

            spawnObstacle() {
                if (this.gameOver || this.paused) return;

                const x = (Math.random() - 0.5) * 20;
                const speed = 0.1 + Math.random() * 0.1 + this.score * 0.001;

                const obstacle = {
                    x: x,
                    z: -50,
                    speed: speed
                };

                this.obstacles.push(obstacle);

                // Create 3D obstacle
                const geometry = new THREE.BoxGeometry(2, 2, 2);
                const hue = Math.random();
                const color = new THREE.Color().setHSL(hue, 0.7, 0.6);
                const material = new THREE.MeshStandardMaterial({
                    color: color,
                    emissive: color,
                    emissiveIntensity: 0.5,
                    roughness: 0.5,
                    metalness: 0.5
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.position.set(x, 1, -50);
                this.scene.add(mesh);
                this.obstacleMeshes.push(mesh);

                // Add rotation animation
                mesh.userData.rotationSpeed = {
                    x: (Math.random() - 0.5) * 0.05,
                    y: (Math.random() - 0.5) * 0.05,
                    z: (Math.random() - 0.5) * 0.05
                };

                setTimeout(() => this.spawnObstacle(), 800 - Math.min(this.score * 2, 600));
            }

            update() {
                if (this.gameOver || this.paused) return;

                // Player movement
                if (this.keys['ArrowLeft'] || this.keys['a'] || this.moveDirection < 0) {
                    this.player.x -= this.player.speed;
                }
                if (this.keys['ArrowRight'] || this.keys['d'] || this.moveDirection > 0) {
                    this.player.x += this.player.speed;
                }

                // Keep player in bounds
                this.player.x = Math.max(-12, Math.min(12, this.player.x));
                this.playerMesh.position.x = this.player.x;

                // Add player rotation based on movement
                if (this.moveDirection !== 0 || this.keys['ArrowLeft'] || this.keys['ArrowRight']) {
                    this.playerMesh.rotation.y += 0.05;
                }

                // Update obstacles
                for (let i = this.obstacles.length - 1; i >= 0; i--) {
                    this.obstacles[i].z += this.obstacles[i].speed;
                    const mesh = this.obstacleMeshes[i];

                    if (mesh) {
                        mesh.position.z = this.obstacles[i].z;

                        // Rotate obstacle
                        mesh.rotation.x += mesh.userData.rotationSpeed.x;
                        mesh.rotation.y += mesh.userData.rotationSpeed.y;
                        mesh.rotation.z += mesh.userData.rotationSpeed.z;
                    }

                    // Check collision
                    const dx = this.player.x - this.obstacles[i].x;
                    const dz = this.player.z - this.obstacles[i].z;
                    const distance = Math.sqrt(dx * dx + dz * dz);

                    if (distance < 2) {
                        this.endGame();
                        return;
                    }

                    // Remove off-screen obstacles
                    if (this.obstacles[i].z > 15) {
                        this.obstacles.splice(i, 1);
                        if (mesh) {
                            this.scene.remove(mesh);
                        }
                        this.obstacleMeshes.splice(i, 1);
                        this.score += 10;
                        document.getElementById('score').textContent = 'Skor: ' + this.score;
                    }
                }
            }

            endGame() {
                this.gameOver = true;
                document.getElementById('finalScore').textContent = 'Skorunuz: ' + this.score;
                document.getElementById('gameOver').classList.add('active');
            }

            reset() {
                // Remove all obstacles
                this.obstacles = [];
                this.obstacleMeshes.forEach(mesh => this.scene.remove(mesh));
                this.obstacleMeshes = [];

                // Reset player
                this.player.x = 0;
                this.playerMesh.position.set(0, 0, this.player.z);
                this.playerMesh.rotation.set(0, 0, 0);

                // Reset game state
                this.score = 0;
                this.gameOver = false;
                this.paused = false;
                document.getElementById('score').textContent = 'Skor: 0';
                document.getElementById('gameOver').classList.remove('active');

                // Restart spawning
                this.spawnObstacle();
            }

            togglePause() {
                this.paused = !this.paused;
            }

            moveLeft() {
                this.moveDirection = -1;
            }

            moveRight() {
                this.moveDirection = 1;
            }

            stopMove() {
                this.moveDirection = 0;
            }

            gameLoop() {
                this.update();
                this.renderer.render(this.scene, this.camera);
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // Start game
        const game = new Game();

        // Live reload support
        if (typeof WebSocket !== 'undefined') {
            const ws = new WebSocket('ws://' + window.location.host);
            ws.onmessage = function(event) {
                if (event.data === 'reload') {
                    window.location.reload();
                }
            };
        }
    </script>
</body>
</html>
